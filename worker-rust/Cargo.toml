[package]
name = "worker-rust"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "worker-rust"
path = "src/main.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["auto-initialize"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["process", "signal", "socket", "fs", "uio"] }
libc = "0.2"
anyhow = "1"
prost = "0.13"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
