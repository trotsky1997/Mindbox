# Brings up `mindbox` (api-rust + e2b-shim in one container).
#
#   docker compose up -d --build
#
# The /jobs durable queue is an opt-in advanced feature backed by an external
# NATS JetStream. See README "Optional: durable async job queue" for how to
# wire it up when you actually need it. Most workloads just use /exec_hot.

services:
  mindbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: mindbox:latest
    environment:
      MINDBOX_MODE: both
      INSPECT_API_TEMPLATES_DIR: /opt/inspect-api/templates
      RUST_LOG: info
    ports:
      - "8000:8000"   # api-rust HTTP (incl. /exec_hot)
      - "8001:8001"   # e2b-shim (E2B-compatible)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/inspect-api/sockets:/opt/inspect-api/sockets
      - ./templates:/opt/inspect-api/templates:ro
      - shim-state:/var/lib/e2b-shim

volumes:
  shim-state:
