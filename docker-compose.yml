# Brings up `mindbox` (api-rust + e2b-shim in one container).
#
# On startup the mindbox entrypoint ensures every configured template has an
# `inspect-tpl-tools-<name>:latest` image on the host docker daemon — pulling
# from `MINDBOX_TEMPLATE_REGISTRY` first, then falling back to a local
# `template-build`. Override `MINDBOX_TEMPLATE_REGISTRY` for a private
# registry, or set `MINDBOX_SKIP_TEMPLATE_ENSURE=1` for shim-only setups.
#
#   cp .env.example .env  # optional, for registry / TOS integration
#   docker compose up -d --build

services:
  mindbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: mindbox:latest
    env_file:
      - path: .env
        required: false
    environment:
      MINDBOX_MODE: both
      INSPECT_API_TEMPLATES_DIR: /opt/inspect-api/templates
      RUST_LOG: info
    ports:
      - "8000:8000"   # api-rust HTTP (/v2 tools API)
      - "8001:8001"   # e2b-shim (E2B-compatible)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/inspect-api/sockets:/opt/inspect-api/sockets
      - ./templates:/opt/inspect-api/templates:ro
      - shim-state:/var/lib/e2b-shim

volumes:
  shim-state:
