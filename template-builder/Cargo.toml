[package]
name = "template-builder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "template-build"
path = "src/main.rs"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
