[package]
name = "e2b-shim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "e2b-shim"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
prost = "0.13"
prost-types = "0.13"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
dashmap = "6"
bollard = "0.17"
futures = "0.3"
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
rust-s3 = { version = "0.36", default-features = false, features = ["tokio-rustls-tls"] }
flate2 = "1"
tar = "0.4"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Added for dedicated-container-per-sandbox mode
[features]
default = []
