[package]
name = "api-rust"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "api-rust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
nix = { version = "0.29", features = ["socket", "uio"] }
libc = "0.2"
bollard = "0.17"
dashmap = "6"
tokio-stream = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }


[dev-dependencies]
tempfile = "3"
assert_matches = "1.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
