# docker-compose.yml template form. Equivalent to template.toml but using
# docker compose as the build orchestrator. Compose gives us declarative
# build args, target selection, cache_from, etc.
#
# template-build sets two env vars when invoking compose:
#   $INSPECT_TPL_NAME — the template name (e.g. "default")
#   $INSPECT_TPL_TAG  — full target tag (e.g. "inspect-tpl-default:latest")
#
# template-build copies worker-rust binary + inspect_pb2.py into the build
# context root before invoking compose, so they're available alongside any
# files you place in templates/<name>/.

services:
  worker:
    image: ${INSPECT_TPL_TAG}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.12-slim
        EXTRA_PIP: ""
        PREWARM_MODULES: ""
        POOL_SIZE: "16"
        PIP_INDEX_URL: https://pypi.org/simple/
        PIP_TRUSTED_HOST: pypi.org
