name: release-image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- mindbox controller image ----------------
      - name: mindbox image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build & push mindbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------- tools template image(s) ----------------
      # template-builder ships inside the mindbox image, so we pull the
      # just-pushed mindbox image back, run it with its templates dir
      # bind-mounted, and let template-build emit the template image to
      # the host docker daemon. Then re-tag for ghcr and push.

      - name: Compute lowercase image base
        id: img
        run: |
          echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Pull mindbox image back as template builder
        run: docker pull ${{ steps.img.outputs.base }}:latest

      - name: Build tools-default template image
        run: |
          set -e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/templates:/opt/inspect-api/templates:ro \
            --entrypoint /usr/local/bin/template-build \
            ${{ steps.img.outputs.base }}:latest \
            tools-default
          # Sanity-check the image exists locally.
          docker images inspect-tpl-tools-tools-default --format \
            'built: {{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Tag & push tools-default template image
        run: |
          set -e
          SHA=${GITHUB_SHA::7}
          TPL=${{ steps.img.outputs.base }}/tpl-tools-default
          docker tag inspect-tpl-tools-tools-default:latest "$TPL:latest"
          docker tag inspect-tpl-tools-tools-default:latest "$TPL:$SHA"
          docker push "$TPL:latest"
          docker push "$TPL:$SHA"
          echo "pushed $TPL:latest + :$SHA"
