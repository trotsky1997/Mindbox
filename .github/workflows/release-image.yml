name: release-image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- mindbox controller image ----------------
      - name: mindbox image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build & push mindbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------- tools template image(s) ----------------
      # template-builder ships inside the mindbox image, so we pull the
      # just-pushed mindbox image back, run it with its templates dir
      # bind-mounted, and let template-build emit the template image to
      # the host docker daemon. Then re-tag for ghcr and push.

      - name: Compute lowercase image base
        id: img
        run: |
          echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Pull mindbox image back as template builder
        run: docker pull ${{ steps.img.outputs.base }}:latest

      - name: Build & push all tools-* template images
        run: |
          set -e
          SHA=${GITHUB_SHA::7}
          # Discover every templates/tools-*/template.toml and build it.
          for dir in templates/tools-*; do
            tpl=$(basename "$dir")
            [ -f "$dir/template.toml" ] || continue
            echo "=== build $tpl ==="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v ${{ github.workspace }}/templates:/opt/inspect-api/templates:ro \
              --entrypoint /usr/local/bin/template-build \
              ${{ steps.img.outputs.base }}:latest \
              "$tpl"
            LOCAL=inspect-tpl-tools-${tpl}:latest
            REMOTE=${{ steps.img.outputs.base }}/tpl-${tpl}
            docker tag "$LOCAL" "$REMOTE:latest"
            docker tag "$LOCAL" "$REMOTE:$SHA"
            docker push "$REMOTE:latest"
            docker push "$REMOTE:$SHA"
            echo "pushed $REMOTE:latest + :$SHA"
          done
