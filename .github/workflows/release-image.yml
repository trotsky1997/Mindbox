name: release-image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  VOLC_IMAGE: image-mindverse-cn-beijing.cr.volces.com/sandboxes/mindbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Volcano CR
        uses: docker/login-action@v3
        with:
          registry: image-mindverse-cn-beijing.cr.volces.com
          username: ${{ secrets.VOLC_CR_USER }}
          password: ${{ secrets.VOLC_CR_PASSWORD }}

      - name: Image metadata (ghcr)
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Image metadata (Volcano CR)
        id: meta_volc
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.VOLC_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build & push (both registries)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # docker/build-push-action accepts a newline-separated list of
          # tags. Mixing two registries makes buildkit push the same
          # manifest+layers twice — once to ghcr, once to Volcano CR.
          tags: |
            ${{ steps.meta_ghcr.outputs.tags }}
            ${{ steps.meta_volc.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
